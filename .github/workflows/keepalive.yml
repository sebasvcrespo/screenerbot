name: Keep-Alive Render

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          echo "Pingeando Render..."
          curl -sf \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 30 \
            https://screenerbot-qqv7.onrender.com && echo " - OK" || echo " - Render no respondió"
